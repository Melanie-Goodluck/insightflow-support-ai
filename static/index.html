<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InsightFlow's grounded AI support assistant">
  <title>InsightFlow Support AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23246bfd'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='25' font-weight='700' fill='white'%3EIF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">IF</div>
      <div>
        <p class="eyebrow">INSIGHTFLOW SUPPORT</p>
        <h1>How can we help?</h1>
        <p class="intro">Ask about uploads, database connections, dashboards, accounts, and access.</p>
      </div>
      <span class="status"><span class="status-dot"></span>Local AI</span>
    </header>

    <section class="chat-card" aria-label="Support conversation">
      <div id="messages" class="messages" aria-live="polite">
        <article class="message assistant-message">
          <div class="avatar" aria-hidden="true">IF</div>
          <div class="bubble">
            <p>Hi! I search the InsightFlow documentation and only answer from the evidence I find.</p>
          </div>
        </article>
      </div>

      <div class="suggestions" aria-label="Example questions">
        <button type="button" class="suggestion">Why was my CSV file rejected?</button>
        <button type="button" class="suggestion">How do I connect PostgreSQL?</button>
        <button type="button" class="suggestion">Why is my dashboard showing old data?</button>
      </div>

      <form id="question-form" class="composer">
        <label for="question" class="sr-only">Ask an InsightFlow support question</label>
        <textarea id="question" name="question" rows="1" maxlength="500" placeholder="Ask an InsightFlow question…" required></textarea>
        <button id="send-button" type="submit" aria-label="Send question">
          <span>Send</span><span aria-hidden="true">→</span>
        </button>
      </form>
      <p class="privacy-note">Runs locally on computer. Answers are checked against retrieved documentation.</p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
